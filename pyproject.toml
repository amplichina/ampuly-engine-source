[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampuly"
version = "0.1.0"
description = "Ampuly Engine — enterprise FDE workflow construction, execution and delivery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-Ampuly-Source-Available-1.0; third-party terms retained, see NOTICE.md"}

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "litellm==1.82.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "playwright>=1.40",
    "mcp>=1.28,<2",
    "anyio>=4.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
    "pypdf>=6.0",
    "lxml>=5.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
browser = []
cli-board = ["textual>=8.1.1"]
jiuwen = ["websockets>=12.0", "json-repair>=0.58.4"]
channels-telegram = ["python-telegram-bot>=21.0"]
channels-whatsapp = ["websockets>=12.0"]
channels-discord = ["discord.py>=2.3"]
channels-feishu = ["lark-oapi>=1.4.0"]
channels-mochat = ["python-socketio[asyncio_client]>=5.11.0"]
channels-dingtalk = ["dingtalk-stream>=0.21.0"]
provider-codex = ["openai-codex==0.147.0"]
superones-runtime = [
    "openai-codex==0.147.0",
    "openai-codex-cli-bin==0.147.0",
    "openai==3.6.0",
    "aiohttp==3.14.3",
    "lark==1.3.1",
]
channels-email = []
channels-slack = ["slack-sdk>=3.27.0"]
channels-qq = ["qq-botpy>=1.2.1"]
channels-matrix = ["matrix-nio>=0.24.0"]
channels-bridges = [
    "websockets>=12.0",
    "python-socketio[asyncio_client]>=5.11.0",
]
channels-all = [
    "python-telegram-bot>=21.0",
    "websockets>=12.0",
    "discord.py>=2.3",
    "lark-oapi>=1.4.0",
    "python-socketio[asyncio_client]>=5.11.0",
    "dingtalk-stream>=0.21.0",
    "slack-sdk>=3.27.0",
    "qq-botpy>=1.2.1",
    "matrix-nio>=0.24.0",
]
all = [
    "python-telegram-bot>=21.0",
    "websockets>=12.0",
    "discord.py>=2.3",
    "lark-oapi>=1.4.0",
    "python-socketio[asyncio_client]>=5.11.0",
    "dingtalk-stream>=0.21.0",
    "slack-sdk>=3.27.0",
    "qq-botpy>=1.2.1",
    "matrix-nio>=0.24.0",
]

dev = [
    "pytest>=9.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
ampuly = "ampuly.cli.app:main"
superones = "ampuly.cli.app:main"
superones-product-backup = "scripts.product_backup:main"

[tool.hatch.build.targets.wheel]
packages = ["ampuly"]
exclude = [
    "**/__pycache__/**", "**/*.pyc", "**/node_modules/**",
    "**/frontend_dist/**", "**/.env", "**/.env.*",
    "**/*.db", "**/*.sqlite", "**/*.sqlite3", "**/*.log",
]

[tool.hatch.build.targets.wheel.force-include]
"config/agent_config.yaml" = "ampuly/config_templates/agent_config.yaml"
"config/channel_config.yaml" = "ampuly/config_templates/channel_config.yaml"
"config/company_corporate_config.yaml" = "ampuly/config_templates/company_corporate_config.yaml"
"config/llm_config.yaml" = "ampuly/config_templates/llm_config.yaml"
"config/system_config.yaml" = "ampuly/config_templates/system_config.yaml"
"skills/core" = "ampuly/skills_assets/core"
"distribution/prompts/talent/general-default-employee.md" = "distribution/prompts/talent/general-default-employee.md"
"scripts/__init__.py" = "scripts/__init__.py"
"scripts/process_probe.py" = "scripts/process_probe.py"
"scripts/product_backup.py" = "scripts/product_backup.py"
"scripts/runtime_lock.py" = "scripts/runtime_lock.py"
"scripts/runtime_sbom.py" = "scripts/runtime_sbom.py"
"scripts/generate_sbom.py" = "scripts/generate_sbom.py"
"examples/isolation/README.md" = "examples/isolation/README.md"
"examples/isolation/sample-clean.txt" = "examples/isolation/sample-clean.txt"
"examples/isolation/CLEAN-PARAMS-POINTER.md" = "examples/isolation/CLEAN-PARAMS-POINTER.md"
"examples/isolation/clean-params-template.json" = "examples/isolation/clean-params-template.json"
"licenses" = "ampuly/third_party_licenses"
"THIRD_PARTY_NOTICES.md" = "ampuly/THIRD_PARTY_NOTICES.md"
"NOTICE.md" = "ampuly/NOTICE.md"
"LICENSE" = "ampuly/LICENSE"
"SPONSORSHIP.zh.md" = "ampuly/SPONSORSHIP.zh.md"

[tool.hatch.build.targets.sdist]
include = [
    "/ampuly/**", "/config/*.yaml", "/skills/core/*.md",
    "/distribution/prompts/talent/general-default-employee.md", "/examples/isolation/*", "/licenses/*",
    "/scripts/__init__.py", "/scripts/process_probe.py", "/scripts/product_backup.py",
    "/scripts/runtime_lock.py", "/scripts/runtime_sbom.py", "/scripts/generate_sbom.py",
    "/README.md", "/SECURITY.md", "/NOTICE.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml", "/SPONSORSHIP.zh.md", "/tests/test_public_release.py",
]
exclude = [
    "**/__pycache__/**", "**/*.pyc", "**/node_modules/**",
    "**/frontend_dist/**", "**/.env", "**/.env.*",
    "**/*.db", "**/*.sqlite", "**/*.sqlite3", "**/*.log",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = ["slow: integration-heavy module; select explicitly for bounded validation"]
timeout = 300
